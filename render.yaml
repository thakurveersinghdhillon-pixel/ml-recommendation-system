# Render Infrastructure-as-Code (IaC) Blueprint Specification
# Official Render deployment specification for ML Recommendation System

databases:
  - name: movie-recommendations-db
    databaseName: ml_recommendations
    user: ml_app
    plan: free
    ipAllowList: [] # Restricts access to internal Render private network only

services:
  # 1. FastAPI ML Recommendation Backend Web Service
  - type: web
    name: ml-recommendation-backend
    runtime: docker
    dockerfilePath: ./docker/backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: https://ml-recommendation-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: movie-recommendations-db
          property: connectionString

  # 2. Next.js Frontend Web Service
  - type: web
    name: ml-recommendation-frontend
    runtime: docker
    dockerfilePath: ../docker/frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://ml-recommendation-backend.onrender.com
